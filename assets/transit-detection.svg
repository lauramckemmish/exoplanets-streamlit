<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title description">
  <title id="title">Transit detection of an exoplanet</title>
  <description id="description">A planet passes in front of its star and causes a small dip in the light measured by a telescope.</description>
  <rect width="1000" height="410" fill="#07172b" rx="24"/>
  <circle cx="230" cy="205" r="112" fill="#ffd66b"/>
  <circle cx="230" cy="205" r="137" fill="#ffd66b" opacity=".15"/>
  <circle cx="492" cy="205" r="38" fill="#3d83c5" stroke="#dceeff" stroke-width="5"/>
  <path d="M390 205H770" stroke="#dceeff" stroke-width="4" stroke-dasharray="10 12" opacity=".7"/>
  <path d="M783 124v162h144" fill="none" stroke="#dceeff" stroke-width="4"/>
  <path d="M795 152c28 0 44 0 60 0s30 18 30 45-14 45-30 45-32 0-60 0" fill="none" stroke="#ff6b6b" stroke-width="5"/>
  <text x="104" y="356" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Star</text>
  <text x="432" y="285" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Planet crosses in front</text>
  <text x="754" y="326" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Tiny dip in starlight</text>
</svg>
