<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title description">
  <title id="title">Transit detection of an exoplanet</title>
  <description id="description">A planet passes in front of its star and causes a small dip in the light measured by a telescope.</description>
  <rect width="1000" height="410" rx="24" fill="#F7F9FC"/>
  <rect x="25" y="25" width="950" height="360" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="500" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172033">Transit detection</text>
  <circle cx="255" cy="208" r="90" fill="#FFD54F"/>
  <g stroke="#FFD54F" stroke-width="7">
    <line x1="255" y1="100" x2="255" y2="78"/><line x1="255" y1="316" x2="255" y2="338"/>
    <line x1="147" y1="208" x2="125" y2="208"/><line x1="363" y1="208" x2="385" y2="208"/>
    <line x1="179" y1="132" x2="161" y2="114"/><line x1="331" y1="284" x2="349" y2="302"/>
    <line x1="179" y1="284" x2="161" y2="302"/><line x1="331" y1="132" x2="349" y2="114"/>
  </g>
  <circle cx="255" cy="208" r="25" fill="#334155"/>
  <path d="M145 104 C205 74 305 74 365 104" fill="none" stroke="#4C78A8" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="255" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Planet crosses in front</text>
  <path d="M480 125V292H905" fill="none" stroke="#94A3B8" stroke-width="4"/>
  <path d="M505 158 H650 V170 H720 V270 H790 V158 H880" fill="none" stroke="#D81B60" stroke-width="8" stroke-linejoin="round"/>
  <text x="692" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">A tiny dip in measured starlight</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/>
    </marker>
  </defs>
</svg>
