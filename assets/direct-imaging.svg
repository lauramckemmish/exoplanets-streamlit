<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title description">
  <title id="title">Direct imaging of an exoplanet</title>
  <description id="description">A planet that appears bright and far from its star is easier to see directly.</description>
  <rect width="1000" height="410" rx="24" fill="#F7F9FC"/>
  <rect x="25" y="25" width="950" height="360" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="500" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Direct imaging</text>
  <circle cx="350" cy="205" r="80" fill="#FFD54F"/>
  <g stroke="#FFD54F" stroke-width="7">
    <line x1="350" y1="95" x2="350" y2="65"/><line x1="350" y1="315" x2="350" y2="345"/>
    <line x1="240" y1="205" x2="210" y2="205"/><line x1="460" y1="205" x2="490" y2="205"/>
    <line x1="272" y1="127" x2="250" y2="105"/><line x1="428" y1="283" x2="450" y2="305"/>
    <line x1="272" y1="283" x2="250" y2="305"/><line x1="428" y1="127" x2="450" y2="105"/>
  </g>
  <circle cx="655" cy="180" r="24" fill="#4C78A8"/>
  <path d="M590 135 L638 163" stroke="#172033" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="662" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">light from planet</text>
  <text x="500" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#334155">Bright planets far from their stars are easier to see.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#172033"/>
    </marker>
  </defs>
</svg>
