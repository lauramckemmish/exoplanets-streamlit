<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Two ways astronomers detect exoplanets</title>
  <description id="description">Direct imaging blocks a bright star so a nearby planet can be recorded. Transit detection measures a small dip in starlight as a planet passes in front of its star.</description>
  <rect width="1200" height="430" rx="24" fill="#F7F9FC"/>
  <rect x="25" y="25" width="555" height="380" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="620" y="25" width="555" height="380" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>

  <text x="302" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Direct imaging</text>
  <circle cx="220" cy="205" r="80" fill="#FFD54F"/>
  <g stroke="#FFD54F" stroke-width="7">
    <line x1="220" y1="95" x2="220" y2="65"/><line x1="220" y1="315" x2="220" y2="345"/>
    <line x1="110" y1="205" x2="80" y2="205"/><line x1="330" y1="205" x2="360" y2="205"/>
    <line x1="142" y1="127" x2="120" y2="105"/><line x1="298" y1="283" x2="320" y2="305"/>
    <line x1="142" y1="283" x2="120" y2="305"/><line x1="298" y1="127" x2="320" y2="105"/>
  </g>
  <circle cx="220" cy="205" r="48" fill="#172033"/>
  <circle cx="425" cy="185" r="19" fill="#4C78A8"/>
  <path d="M382 145 L418 169" stroke="#172033" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="445" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">planet light</text>
  <text x="302" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#334155">Block the star's glare and record light from the planet.</text>

  <text x="897" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Transit detection</text>
  <circle cx="790" cy="195" r="85" fill="#FFD54F"/>
  <circle cx="790" cy="195" r="23" fill="#172033"/>
  <path d="M705 195 H875" stroke="#4C78A8" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M935 140 L975 140 L995 235 L1015 140 L1060 140" fill="none" stroke="#D81B60" stroke-width="6" stroke-linejoin="round"/>
  <text x="998" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">measured starlight</text>
  <text x="897" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#334155">Measure the small dip when a planet crosses the star.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#172033"/>
    </marker>
  </defs>
</svg>
